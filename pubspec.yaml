name: flutter_online_bookstore
description: "A complete online bookstore Flutter application integrated with Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase Cloud Database & Auth
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Local Key-Value Persistence
  shared_preferences: ^2.2.3

  # UI Design & Utilities
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
